# Mac(arm64)에서 amd64로 크로스 빌드하면 QEMU 에뮬레이션 때문에 Gradle·Next 빌드가
# 10~30배 느려진다. 이 워크플로는 GitHub의 amd64 러너에서 네이티브로 빌드해 GHCR에 올린다 —
# deploy.sh 와 결과물(이미지 태그·이름)이 완전히 동일한 대체 경로다.
#
# 실행: Actions 탭 → "build & push to GHCR" → Run workflow → api_base_url 입력
name: build & push to GHCR

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "브라우저가 호출할 api-core 공개 주소 (예: http://your-domain.com:8080)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: opro

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai-engine
            context: ./apps/ai-engine
          - name: api-core
            context: ./apps/api-core
          - name: web
            context: ./apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR은 대문자 경로를 거부한다 — 조직명(KB-AI-Challenge-Just-it)을 소문자로 변환.
      - name: owner 소문자 변환
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          # web 이외 서비스는 이 build-arg를 그냥 무시한다.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.api_base_url }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
